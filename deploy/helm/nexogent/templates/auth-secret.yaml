{{- if not .Values.auth.existingSecret }}
{{- /* reuse an existing session secret on upgrade so sessions survive */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "CodeSentinal.-auth") }}
{{- $session := "" }}
{{- if and $existing $existing.data (index $existing.data "SESSION_SECRET") }}
{{- $session = index $existing.data "SESSION_SECRET" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: CodeSentinal.-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
type: Opaque
stringData:
  {{- if .Values.auth.password }}
  SUPERADMIN_PASSWORD: {{ .Values.auth.password | quote }}
  {{- end }}
  SESSION_SECRET: {{ $session | quote }}
  {{- if .Values.alerts.webhook }}
  SLACK_WEBHOOK_URL: {{ .Values.alerts.webhook | quote }}
  {{- end }}
{{- end }}
