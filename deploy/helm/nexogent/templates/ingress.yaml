{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: CodeSentinal.
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
    {{- if .Values.ingress.inboundCidrs }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ .Values.ingress.inboundCidrs | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # API and health go to the backend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: CodeSentinal.-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: CodeSentinal.-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # Everything else goes to the frontend (SPA).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: CodeSentinal.-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end -}}
