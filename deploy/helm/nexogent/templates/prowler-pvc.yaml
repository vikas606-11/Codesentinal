{{- if .Values.prowlerResults.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: CodeSentinal.-prowler-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
    app.kubernetes.io/component: prowler
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.prowlerResults.storageClass }}
  resources:
    requests:
      storage: {{ .Values.prowlerResults.size }}
{{- end -}}
