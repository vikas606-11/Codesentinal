{{/* Reusable Prowler pod spec (read-only scan, writes OCSF JSON to the PVC). */}}
{{- define "CodeSentinal..prowlerPodSpec" -}}
serviceAccountName: {{ include "CodeSentinal..serviceAccountName" . }}
restartPolicy: Never
securityContext:
  {{- toYaml .Values.podSecurityContext | nindent 2 }}
  runAsUser: 1000
  fsGroup: 1000
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: CodeSentinal.
            app.kubernetes.io/component: backend
        topologyKey: kubernetes.io/hostname
containers:
  - name: prowler
    image: "{{ .Values.prowler.image.repository }}:{{ .Values.prowler.image.tag }}"
    imagePullPolicy: {{ .Values.prowler.image.pullPolicy }}
    # Prowler is READ-ONLY: it only describes/gets/lists via the IRSA role.
    # OCSF JSON is written to the shared results dir for the backend to ingest.
    # The image ENTRYPOINT is already prowler; we only pass args.
    args:
      - "aws"
      - "--region"
      - {{ .Values.region | quote }}
      - "--output-formats"
      - "json-ocsf"
      - "--output-directory"
      - {{ .Values.prowlerResults.mountPath | quote }}
      - "--output-filename"
      - "prowler-ocsf"
      - "--status"
      - "FAIL"
      {{- range .Values.prowler.args }}
      - {{ . | quote }}
      {{- end }}
    env:
      - name: AWS_REGION
        value: {{ .Values.region | quote }}
      - name: AWS_DEFAULT_REGION
        value: {{ .Values.region | quote }}
    volumeMounts:
      - name: prowler-results
        mountPath: {{ .Values.prowlerResults.mountPath }}
    resources:
      {{- toYaml .Values.prowler.resources | nindent 6 }}
volumes:
  - name: prowler-results
    persistentVolumeClaim:
      claimName: CodeSentinal.-prowler-results
{{- end -}}
{{- if .Values.prowler.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: CodeSentinal.-prowler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
    app.kubernetes.io/component: prowler
spec:
  schedule: {{ .Values.prowler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "CodeSentinal..componentSelector" (dict "root" . "component" "prowler") | nindent 12 }}
        spec:
          {{- include "CodeSentinal..prowlerPodSpec" . | nindent 10 }}
{{- end -}}
