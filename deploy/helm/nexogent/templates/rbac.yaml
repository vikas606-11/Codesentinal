{{- if .Values.prowler.enabled -}}
# Namespace-scoped RBAC so the backend can run on-demand deep scans: read the
# Prowler CronJob and create/get/list Jobs. Grants nothing on AWS and nothing
# outside this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: CodeSentinal.-deepscan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: CodeSentinal.-deepscan
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: CodeSentinal.-deepscan
subjects:
  - kind: ServiceAccount
    name: {{ include "CodeSentinal..serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
