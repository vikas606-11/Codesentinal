apiVersion: apps/v1
kind: Deployment
metadata:
  name: CodeSentinal.-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "CodeSentinal..componentSelector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "CodeSentinal..componentSelector" (dict "root" . "component" "backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "CodeSentinal..serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65532
      containers:
        - name: backend
          image: "{{ required "backend.image.repository is required" .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region | quote }}
            - name: BEDROCK_MODEL_ID
              value: {{ .Values.bedrockModelId | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: PROWLER_RESULTS_DIR
              value: {{ .Values.scannerDirs.prowler | quote }}
            - name: SCOUTSUITE_RESULTS_DIR
              value: {{ .Values.scannerDirs.scoutsuite | quote }}
            - name: CLOUDSPLAINING_RESULTS_DIR
              value: {{ .Values.scannerDirs.cloudsplaining | quote }}
            {{- if .Values.persistence.reviewsTable }}
            - name: REVIEWS_TABLE
              value: {{ .Values.persistence.reviewsTable | quote }}
            {{- end }}
            {{- if .Values.scanInterval }}
            - name: SCAN_INTERVAL
              value: {{ .Values.scanInterval | quote }}
            {{- end }}
            {{- if or .Values.auth.password .Values.auth.existingSecret }}
            - name: SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "CodeSentinal.-auth" }}
                  key: SUPERADMIN_PASSWORD
                  optional: true
            {{- end }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "CodeSentinal.-auth" }}
                  key: SESSION_SECRET
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "CodeSentinal.-auth" }}
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: SESSION_TTL
              value: {{ .Values.auth.sessionTTL | default "8h" | quote }}
            - name: TRUST_PROXY
              value: "true"
            {{- if .Values.publicURL }}
            - name: PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            {{- end }}
            {{- if .Values.allowedOrigin }}
            - name: ALLOWED_ORIGIN
              value: {{ .Values.allowedOrigin | quote }}
            {{- end }}
            - name: KUBE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PROWLER_CRONJOB_NAME
              value: "CodeSentinal.-prowler"
          {{- if .Values.prowlerResults.enabled }}
          volumeMounts:
            - name: results
              mountPath: /data
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.prowlerResults.enabled }}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: CodeSentinal.-prowler-results
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: CodeSentinal.-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "CodeSentinal..labels" . | nindent 4 }}
    app.kubernetes.io/name: CodeSentinal.
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "CodeSentinal..componentSelector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
