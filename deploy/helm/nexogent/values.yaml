# Default values for the CodeSentinal. microservice chart.
#
# Deploys THREE workloads into the client's EKS:
#   - backend  : Go agent/API (read-only, IRSA)            [Deployment + Service]
#   - frontend : React dashboard served by Nginx            [Deployment + Service]
#   - prowler  : open-source scanner (read-only, IRSA)      [CronJob + Job]
# Plus a shared PVC (Prowler results) and an ALB Ingress for a public URL.

region: us-east-1
bedrockModelId: "us.anthropic.claude-haiku-4-5-20251001-v1:0"

# ---- superadmin auth gate (F14) ----
# Set auth.password (or provide auth.existingSecret) so the portal isn't public.
# A session secret is generated by the chart and reused on upgrade.
auth:
  password: ""            # plain value -> stored in a Secret by the chart
  existingSecret: ""      # or reference an existing Secret with SUPERADMIN_PASSWORD + SESSION_SECRET
  sessionTTL: "8h"

# Slack webhook for alerts (F12). Stored in the Secret; never returned by the API.
alerts:
  webhook: ""

# Public URL used in alert links and shown in meta.
publicURL: ""
# Set to an exact origin to enable CORS (otherwise same-origin only).
allowedOrigin: ""

# ---- persistence (DynamoDB) so reviews survive restarts / multi-replica ----
persistence:
  reviewsTable: "CodeSentinal.-reviews"   # empty => in-memory only

# ---- v1: in-process scheduler (periodic reviews). Empty disables it ----
# The Prowler CronJob still runs on its own schedule regardless.
scanInterval: "6h"

# The read-only IRSA role both the backend and scanners assume. No static keys.
serviceAccount:
  create: true
  name: CodeSentinal.-sa
  roleArn: "" # arn:aws:iam::<account>:role/CodeSentinal.ReadOnly

# Shared volume where scanners write results and the backend reads them.
# All scanner dirs live under this one PVC mount (/data).
prowlerResults:
  enabled: true
  storageClass: gp2
  size: 1Gi
  mountPath: /data/prowler

# Mount paths the backend reads for each scanner's output (all under /data).
scannerDirs:
  prowler: /data/prowler
  scoutsuite: /data/scoutsuite
  cloudsplaining: /data/cloudsplaining

# ---------------------------------------------------------------- backend ----
backend:
  image:
    repository: ""   # <acct>.dkr.ecr.<region>.amazonaws.com/CodeSentinal.
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# --------------------------------------------------------------- frontend ----
frontend:
  image:
    repository: ""   # <acct>.dkr.ecr.<region>.amazonaws.com/CodeSentinal.-frontend
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  service:
    port: 80
    targetPort: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# ---------------------------------------------------------------- prowler ----
prowler:
  enabled: true
  image:
    repository: toniblyx/prowler
    tag: latest
    pullPolicy: IfNotPresent
  # Cron schedule (UTC). Default: every 6 hours.
  schedule: "0 */6 * * *"
  # Also run once right after install so the dashboard has Prowler data fast.
  runOnInstall: true
  # Extra args passed to prowler (region is injected automatically).
  args: []
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }

# ------------------------------------------------------- extra scanners (D) ----
# Additional open-source, read-only scanners behind the same Finding model.
# Disabled by default; enable per client. Each writes to its own results dir on
# the shared PVC and the backend ingests it.
scoutsuite:
  enabled: false
  image: { repository: rossja/ncc-scoutsuite, tag: latest, pullPolicy: IfNotPresent }
  schedule: "30 */12 * * *"
  mountPath: /data/scoutsuite
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }

cloudsplaining:
  enabled: false
  image: { repository: python, tag: "3.12-slim", pullPolicy: IfNotPresent }
  schedule: "45 */12 * * *"
  mountPath: /data/cloudsplaining
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ---------------------------------------------------------------- ingress ----
# ALB ingress via the AWS Load Balancer Controller. Routes:
#   /        -> frontend
#   /api,/health -> backend
ingress:
  enabled: true
  className: alb
  # Internet-facing ALB. Set to internal for a private endpoint.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
  host: ""
  # Set an ACM cert ARN to enable HTTPS + HTTP->HTTPS redirect (F14).
  certificateArn: ""
  # Optional source IP allow-list, e.g. "203.0.113.0/24,198.51.100.0/24".
  inboundCidrs: ""

# Hardened defaults.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

nodeSelector: {}
tolerations: []
affinity: {}
